services:
  - type: web
    name: linkplease
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PSEUDOGRAM_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: PSEUDOGRAM_BASE_URL
        value: https://pseudogram-api.onrender.com
      - key: SIGNATURE_VERIFICATION_ENABLED
        value: "false"   # Disabled: simulator doesn't sign payloads
      - key: MAX_RETRIES
        value: "5"
      - key: DM_CONCURRENCY
        value: "10"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
